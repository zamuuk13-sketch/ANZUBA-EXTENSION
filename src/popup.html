<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANZUBA</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 280px;
      margin: 0;
      padding: 18px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0 0 14px; opacity: .72; font-size: 13px; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      border-radius: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #35c759;
    }
  </style>
</head>
<body>
  <h1>ANZUBA</h1>
  <p>Ambiente virtual para IAs.</p>
  <div class="status"><span class="dot"></span><span>Extensão ativa</span></div>
</body>
</html>
